<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <clipPath id="roundedClip">
      <rect width="500" height="500" rx="60" />
    </clipPath>
  </defs>
  <rect width="500" height="500" fill="#FFFFFF" rx="60" stroke="#C5A880" stroke-width="4" />
  <g clip-path="url(#roundedClip)">
    <image href="/logo-official.jpg" x="20" y="20" width="460" height="460" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
